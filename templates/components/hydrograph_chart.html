<!-- Hydrogramme Interactif & Métriques Deep Learning (Thème Modern Organic Maroc) -->
<div class="bg-white border border-[#e8e5df] rounded-2xl p-2.5 sm:p-3 shadow-xs flex flex-col h-full overflow-hidden">
    
    <!-- En-tête Compact avec Titre, Métriques Clés & Outils de Contrôle -->
    <div class="flex items-center justify-between gap-2 pb-2 border-b border-slate-100 shrink-0">
        <div class="flex items-center space-x-2 min-w-0">
            <div class="w-2.5 h-2.5 rounded-full bg-teal-600 shrink-0 animate-pulse"></div>
            <h3 class="font-heading font-bold text-xs sm:text-sm text-slate-800 flex items-center space-x-1.5 truncate">
                <span>Hydrogramme Simulé LSTM</span>
                <span class="text-[11px] px-2 py-0.5 rounded-md bg-teal-50 border border-teal-200 text-teal-800 font-mono font-medium truncate" x-show="currentBasinName" x-text="currentBasinName"></span>
            </h3>
        </div>

        <!-- Outils & Sélecteurs d'échelle -->
        <div class="flex items-center space-x-1.5 shrink-0">
            <!-- Sélecteur d'échelle temporelle : Journalier vs Mensuel -->
            <div class="bg-slate-100 p-0.5 rounded-lg border border-slate-200 text-xs flex">
                <button 
                    @click="setChartMode('daily')" 
                    :class="chartMode === 'daily' ? 'bg-white text-teal-900 font-semibold shadow-xs' : 'text-slate-500 hover:text-slate-700'" 
                    class="px-2 py-1 rounded-md transition flex items-center space-x-1 text-[11px]"
                >
                    <i class="fa-solid fa-chart-line text-[10px] text-teal-600"></i>
                    <span class="hidden xs:inline">Journalier</span>
                    <span class="text-[9px] text-slate-400 hidden sm:inline">(m³/s)</span>
                </button>
                <button 
                    @click="setChartMode('monthly')" 
                    :class="chartMode === 'monthly' ? 'bg-white text-teal-900 font-semibold shadow-xs' : 'text-slate-500 hover:text-slate-700'" 
                    class="px-2 py-1 rounded-md transition flex items-center space-x-1 text-[11px]"
                >
                    <i class="fa-solid fa-chart-column text-[10px] text-sky-600"></i>
                    <span class="hidden xs:inline">Mensuel</span>
                    <span class="text-[9px] text-slate-400 hidden sm:inline">(hm³/m)</span>
                </button>
            </div>

            <!-- Export CSV -->
            <button 
                type="button"
                @click="exportCSV()" 
                :disabled="!currentRunId" 
                class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 disabled:opacity-30 disabled:cursor-not-allowed border border-slate-200 rounded-lg text-[11px] text-slate-700 font-medium transition flex items-center space-x-1.5 shadow-xs" 
                :title="'Exporter les séries temporelles ' + (chartMode === 'monthly' ? 'mensuelles (hm³/m)' : 'journalières (m³/s)') + ' en fichier CSV (compatible Excel)'"
            >
                <i class="fa-solid fa-file-csv text-teal-700 text-xs"></i>
                <span class="font-semibold text-slate-800" x-text="chartMode === 'monthly' ? 'CSV (Mensuel)' : 'CSV (Journalier)'">CSV</span>
                <i class="fa-solid fa-download text-[9px] text-slate-400"></i>
            </button>

            <!-- Boutons d'ajustement de la taille du tiroir (avec @click.stop pour éviter tout rebond) -->
            <div class="flex items-center bg-slate-100 p-0.5 rounded-lg border border-slate-200 text-xs">
                <button 
                    @click.stop="setChartDrawerState('minimized')" 
                    :class="chartDrawerState === 'minimized' ? 'bg-white text-slate-800 shadow-xs' : 'text-slate-400 hover:text-slate-600'" 
                    class="p-1 rounded px-1.5 transition" 
                    title="Réduire le panneau vers la carte"
                >
                    <i class="fa-solid fa-minus text-[9px]"></i>
                </button>
                <button 
                    @click.stop="setChartDrawerState('standard')" 
                    :class="chartDrawerState === 'standard' ? 'bg-white text-slate-800 shadow-xs' : 'text-slate-400 hover:text-slate-600'" 
                    class="p-1 rounded px-1.5 transition" 
                    title="Taille standard"
                >
                    <i class="fa-regular fa-window-maximize text-[9px]"></i>
                </button>
                <button 
                    @click.stop="setChartDrawerState('expanded')" 
                    :class="chartDrawerState === 'expanded' ? 'bg-white text-slate-800 shadow-xs' : 'text-slate-400 hover:text-slate-600'" 
                    class="p-1 rounded px-1.5 transition" 
                    title="Agrandir en grand format"
                >
                    <i class="fa-solid fa-up-right-and-down-left-from-center text-[9px]"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Ruban Compact de Statistiques & Métriques Globales -->
    <template x-if="currentStats">
        <div class="flex items-center justify-between gap-1.5 py-1 px-2 mt-1 bg-[#faf8f5] rounded-xl border border-[#e8e5df] text-[11px] shrink-0 overflow-x-auto custom-scrollbar">
            <div class="flex items-center space-x-1 shrink-0">
                <span class="text-slate-400 text-[10px] uppercase font-medium">Vol. Total:</span>
                <span class="font-mono font-bold text-sky-800" x-text="currentStats.total_sim_volume_hm3 + ' hm³'"></span>
            </div>
            <span class="text-slate-300">|</span>
            <div class="flex items-center space-x-1 shrink-0">
                <span class="text-slate-400 text-[10px] uppercase font-medium">Q. Moyen:</span>
                <span class="font-mono font-bold text-teal-800" x-text="currentStats.mean_sim_discharge_m3s + ' m³/s'"></span>
            </div>
            <span class="text-slate-300">|</span>
            <div class="flex items-center space-x-1 shrink-0">
                <span class="text-slate-400 text-[10px] uppercase font-medium">Pointe:</span>
                <span class="font-mono font-bold text-amber-700" x-text="currentStats.peak_sim_discharge_m3s + ' m³/s'"></span>
            </div>
            <span class="text-slate-300">|</span>
            <div class="flex items-center space-x-1 shrink-0">
                <span class="text-slate-400 text-[10px] uppercase font-medium">Lame:</span>
                <span class="font-mono font-bold text-emerald-700" x-text="currentStats.mean_sim_runoff_mm + ' mm (C=' + currentStats.runoff_coefficient + ')'"></span>
            </div>
            <template x-if="currentMetrics && currentMetrics.has_obs">
                <div class="flex items-center space-x-2 shrink-0 ml-auto pl-2 border-l border-slate-200 text-[10px] font-mono">
                    <span class="font-bold px-1.5 py-0.2 rounded" :class="currentMetrics?.KGE_monthly >= 0.5 ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'" x-text="'KGE ' + (currentMetrics?.KGE_monthly ?? '--')"></span>
                    <span class="text-teal-700 font-semibold" x-show="currentMetrics?.NSE_monthly != null" x-text="'NSE ' + currentMetrics?.NSE_monthly"></span>
                    <span class="text-sky-700 font-semibold" x-show="currentMetrics?.PBIAS_pct != null" x-text="'PBIAS ' + currentMetrics?.PBIAS_pct + '%'"></span>
                </div>
            </template>
        </div>
    </template>

    <!-- Zone Principale : Disposition Côte à Côte (8 Attributs Statiques + Hydrogramme Canvas) -->
    <div class="flex-1 min-h-0 flex flex-col md:flex-row gap-2 mt-1.5 w-full h-full overflow-hidden">
        
        <!-- Panneau Latéral Gauche : Les 8 Attributs Statiques & Diagnostic -->
        <div class="w-full md:w-52 lg:w-56 shrink-0 bg-[#faf8f5] border border-[#e8e5df] rounded-xl p-2 flex flex-col justify-between overflow-y-auto custom-scrollbar text-xs">
            <div>
                <div class="flex items-center justify-between pb-1 border-b border-[#e8e5df]">
                    <span class="text-[10px] font-bold uppercase tracking-wider text-teal-800 flex items-center">
                        <i class="fa-solid fa-sliders text-teal-700 mr-1.5"></i> 8 Attributs Statiques
                    </span>
                    <span class="text-[9px] font-mono px-1.5 py-0.2 rounded bg-white border border-[#e8e5df] text-slate-500">Bassin</span>
                </div>

                <!-- Grille des 8 Attributs -->
                <template x-if="currentAttributes">
                    <div class="grid grid-cols-2 md:grid-cols-1 gap-1 py-1 text-[10px]">
                        <div class="flex items-center justify-between p-1 bg-white rounded-lg border border-[#f0ede6]">
                            <span class="text-slate-500 truncate"><i class="fa-solid fa-mountain text-teal-600 mr-1"></i>Altitude</span>
                            <span class="font-mono font-bold text-slate-800" x-text="currentAttributes.elev_mean + ' m'"></span>
                        </div>
                        <div class="flex items-center justify-between p-1 bg-white rounded-lg border border-[#f0ede6]">
                            <span class="text-slate-500 truncate"><i class="fa-solid fa-chart-line text-teal-600 mr-1"></i>Pente</span>
                            <span class="font-mono font-bold text-slate-800" x-text="currentAttributes.slope_mean + ' m/km'"></span>
                        </div>
                        <div class="flex items-center justify-between p-1 bg-white rounded-lg border border-[#f0ede6]">
                            <span class="text-slate-500 truncate"><i class="fa-solid fa-tree text-emerald-600 mr-1"></i>Forêt</span>
                            <span class="font-mono font-bold text-slate-800" x-text="((currentAttributes.forest_frac ?? 0) * 100).toFixed(1) + '%'"></span>
                        </div>
                        <div class="flex items-center justify-between p-1 bg-white rounded-lg border border-[#f0ede6]">
                            <span class="text-slate-500 truncate"><i class="fa-solid fa-cloud-rain text-sky-600 mr-1"></i>Précip.</span>
                            <span class="font-mono font-bold text-slate-800" x-text="currentAttributes.p_mean ? (currentAttributes.p_mean * 365.25).toFixed(0) + ' mm' : '--'"></span>
                        </div>
                        <div class="flex items-center justify-between p-1 bg-white rounded-lg border border-[#f0ede6]">
                            <span class="text-slate-500 truncate"><i class="fa-solid fa-sun text-amber-600 mr-1"></i>Aridité</span>
                            <span class="font-mono font-bold text-slate-800" x-text="currentAttributes.aridity"></span>
                        </div>
                        <div class="flex items-center justify-between p-1 bg-white rounded-lg border border-[#f0ede6]">
                            <span class="text-slate-500 truncate"><i class="fa-solid fa-snowflake text-cyan-600 mr-1"></i>Neige</span>
                            <span class="font-mono font-bold text-slate-800" x-text="((currentAttributes.frac_snow ?? 0) * 100).toFixed(1) + '%'"></span>
                        </div>
                        <div class="flex items-center justify-between p-1 bg-white rounded-lg border border-[#f0ede6]">
                            <span class="text-slate-500 truncate"><i class="fa-solid fa-calendar text-indigo-600 mr-1"></i>Saison.</span>
                            <span class="font-mono font-bold text-slate-800" x-text="currentAttributes.p_seasonality"></span>
                        </div>
                        <div class="flex items-center justify-between p-1 bg-white rounded-lg border border-[#f0ede6]">
                            <span class="text-slate-500 truncate"><i class="fa-solid fa-vector-square text-teal-600 mr-1"></i>Superficie</span>
                            <span class="font-mono font-bold text-slate-800" x-text="currentAttributes.area_km2 + ' km²'"></span>
                        </div>
                    </div>
                </template>

                <template x-if="!currentAttributes">
                    <div class="py-6 text-center text-slate-400 text-[10px] italic">
                        Sélectionnez une station ou délinéez un exutoire pour charger les 8 attributs.
                    </div>
                </template>
            </div>

            <!-- Statut Enveloppe Opérationnelle -->
            <template x-if="currentEnvelope">
                <div class="pt-1 border-t border-[#e8e5df] flex items-center justify-between text-[10px]">
                    <span class="text-slate-500 font-medium">Enveloppe :</span>
                    <span class="px-1.5 py-0.2 rounded-full font-bold font-mono text-[9px]"
                        :class="{
                            'bg-emerald-100 text-emerald-800 border border-emerald-200': currentEnvelope.overall_status === 'valid',
                            'bg-amber-100 text-amber-800 border border-amber-200': currentEnvelope.overall_status === 'warning',
                            'bg-rose-100 text-rose-800 border border-rose-200': currentEnvelope.overall_status === 'critical'
                        }"
                        x-text="currentEnvelope.overall_status === 'valid' ? 'Valide' : (currentEnvelope.overall_status === 'warning' ? 'Alerte' : 'Critique')">
                    </span>
                </div>
            </template>
        </div>

        <!-- Panneau Droit : Filtre Temporel & Canvas Graphique -->
        <div class="flex-1 min-h-0 flex flex-col w-full h-full overflow-hidden">
            
            <!-- Barre de Filtre Temporel par Dates (Date Début & Date Fin) contrainte sur l'intervalle 10 ans -->
            <div class="flex flex-wrap items-center justify-between gap-1.5 pb-1 text-[11px] text-slate-600 shrink-0 border-b border-slate-100">
                <div class="flex items-center space-x-1.5">
                    <span class="text-[10px] font-bold uppercase tracking-wider text-slate-500 flex items-center">
                        <i class="fa-regular fa-calendar-days text-teal-700 mr-1"></i> Période :
                    </span>
                    <div class="flex items-center space-x-1 bg-white border border-[#d8d3c8] rounded-md px-1.5 py-0.5 shadow-2xs">
                        <span class="text-[9px] text-slate-400 uppercase">Du</span>
                        <input 
                            type="date" 
                            x-model="dateFilterStart" 
                            :min="forcingIntervalStart"
                            :max="dateFilterEnd || forcingIntervalEnd"
                            @input="onDateFilterChange()" 
                            @change="onDateFilterChange()" 
                            class="bg-transparent text-[10px] text-slate-800 focus:outline-none font-mono"
                        >
                        <span class="text-[9px] text-slate-400 uppercase ml-1">Au</span>
                        <input 
                            type="date" 
                            x-model="dateFilterEnd" 
                            :min="dateFilterStart || forcingIntervalStart"
                            :max="forcingIntervalEnd"
                            @input="onDateFilterChange()" 
                            @change="onDateFilterChange()" 
                            class="bg-transparent text-[10px] text-slate-800 focus:outline-none font-mono"
                        >
                    </div>
                    <button 
                        @click="resetDateFilter()" 
                        class="px-2 py-0.5 bg-slate-100 hover:bg-slate-200 border border-slate-200 rounded-md text-[10px] font-medium text-slate-700 transition flex items-center space-x-1 shadow-2xs" 
                        title="Réinitialiser l'affichage sur toute la chronique des 10 ans"
                    >
                        <i class="fa-solid fa-rotate-left text-teal-700 text-[9px]"></i>
                        <span>Tout (10 ans)</span>
                    </button>
                    <!-- Badge rappelant l'intervalle strict des 10 ans -->
                    <template x-if="forcingIntervalStart && forcingIntervalEnd">
                        <span class="text-[9.5px] font-mono px-1.5 py-0.5 rounded bg-teal-50 border border-teal-200 text-teal-800 font-semibold"
                              :title="'Intervalle strict du forçage simulé : ' + forcingIntervalStart + ' au ' + forcingIntervalEnd"
                              x-text="'[' + forcingIntervalStart.slice(0,4) + '–' + forcingIntervalEnd.slice(0,4) + ']'">
                        </span>
                    </template>
                </div>

                <!-- Légende descriptive dynamique -->
                <div class="flex items-center space-x-2 text-[10px]">
                    <span class="flex items-center space-x-1">
                        <span class="w-2.5 h-2.5 rounded-xs bg-sky-500 inline-block"></span>
                        <span class="text-slate-600">Simulé</span>
                    </span>
                    <template x-if="currentMetrics && currentMetrics.has_obs">
                        <span class="flex items-center space-x-1">
                            <span class="w-2.5 h-0.5 bg-amber-600 inline-block"></span>
                            <span class="text-amber-800 font-medium">Observé in situ</span>
                        </span>
                    </template>
                </div>
            </div>

            <!-- Conteneur Graphique Canvas Aéré & Pleinement Visible (min-h-0 + flex-1) -->
            <div class="flex-1 min-h-0 relative w-full h-full mt-1 overflow-hidden">
                <canvas id="hydrographCanvas" class="w-full h-full block"></canvas>
                <div x-show="!hasSimulationData" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 text-xs bg-slate-50/80 backdrop-blur-xs rounded-xl border border-dashed border-slate-200">
                    <div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center mb-2 text-slate-400">
                        <i class="fa-solid fa-chart-area text-lg"></i>
                    </div>
                    <p class="font-medium text-slate-600 text-xs text-center px-4">Pointez un exutoire ou choisissez une station pour afficher l'hydrogramme et ses attributs.</p>
                </div>
            </div>
        </div>
    </div>
</div>
